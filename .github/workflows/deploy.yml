name: Otomasi Deploy WARKOP RR

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Google Clasp
        run: npm install -g @google/clasp

      - name: Inject Credentials & Script ID
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json
          sed -i 's/PLACEHOLDER_SCRIPT_ID/${{ secrets.SCRIPT_ID }}/g' .clasp.json

      - name: Push Kode ke Google Apps Script
        run: clasp push --force

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Frontend Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend'

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4