<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WARKOP RR - Kasir Pro</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#12161A">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark">

  <!-- AUTH SCREEN -->
  <div id="loginScreen" class="auth-wrapper">
    <div class="auth-card shadow-lg p-4">
      <div class="text-center mb-4">
        <div class="brand-logo">☕</div>
        <h4 class="fw-bold text-white mb-1">WARKOP RR</h4>
        <small class="text-secondary">Enterprise Multi-Branch POS</small>
      </div>
      
      <form id="loginForm" onsubmit="handleAuthLogin(event)">
        <div class="mb-3">
          <label class="form-label text-light small">Username</label>
          <input type="text" id="loginUsername" class="form-control form-control-dark" placeholder="Username kasir" required autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label text-light small">Password</label>
          <input type="password" id="loginPassword" class="form-control form-control-dark" placeholder="Password" required autocomplete="current-password">
        </div>
        <div class="mb-4">
          <label class="form-label text-light small">Pilih Shift</label>
          <select id="loginShift" class="form-select form-select-dark">
            <option value="Pagi">Shift Pagi</option>
            <option value="Malam">Shift Malam</option>
          </select>
        </div>
        <button type="submit" id="btnLoginSubmit" class="btn btn-primary-custom w-100 py-2 fw-semibold">
          Masuk ke Kasir
        </button>
      </form>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="mainApp" style="display: none;">
    <header class="app-header px-3 py-2 d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2">
        <span class="fs-5">☕</span>
        <div>
          <h6 class="mb-0 fw-bold text-white lh-1">WARKOP RR</h6>
          <small class="user-badge" id="headerUserLabel">Cabang: -</small>
        </div>
      </div>

      <div class="d-flex align-items-center gap-2">
        <div class="lembur-toggle d-flex align-items-center px-2 py-1">
          <input type="checkbox" id="checkLembur" class="form-check-input me-1 m-0">
          <label for="checkLembur" class="small text-white m-0">Lembur</label>
        </div>
        <button class="btn-icon" onclick="handleAuthLogout()" title="Keluar">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </header>

    <main class="app-content pb-5 mb-4">
      <!-- VIEW 1: MENU POS -->
      <section id="viewMenu" class="tab-view active">
        <div class="px-3 pt-2">
          <div class="search-input-wrap mb-2">
            <i class="bi bi-search"></i>
            <input type="text" id="searchMenu" class="form-control form-control-dark ps-5" placeholder="Cari kopi, indomie..." onkeyup="renderCatalog()">
          </div>
          <div class="category-pills d-flex gap-1 overflow-auto pb-1">
            <button class="cat-pill active" onclick="setCategory('Semua', this)">Semua</button>
            <button class="cat-pill" onclick="setCategory('Minuman', this)">Minuman</button>
            <button class="cat-pill" onclick="setCategory('Makanan', this)">Makanan</button>
            <button class="cat-pill" onclick="setCategory('Tambahan', this)">Add-on</button>
          </div>
        </div>
        <div class="container-fluid px-3 pt-2">
          <div class="row g-2" id="catalogGrid"></div>
        </div>
      </section>

      <!-- VIEW 2: CHECKOUT CART -->
      <section id="viewCart" class="tab-view">
        <div class="container-fluid px-3 pt-2">
          <div class="card bg-dark-card border-0 p-3 mb-3">
            <h6 class="fw-bold text-white mb-2">Data Pelanggan & Meja</h6>
            <div class="row g-2">
              <div class="col-7">
                <input type="text" id="orderCust" class="form-control form-control-dark" placeholder="Nama Pelanggan (Wajib bila Kasbon)">
              </div>
              <div class="col-5">
                <input type="text" id="orderTable" class="form-control form-control-dark" placeholder="No. Meja">
              </div>
            </div>
          </div>

          <div class="card bg-dark-card border-0 p-3 mb-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h6 class="fw-bold text-white mb-0">Pesanan Dipilih</h6>
              <button class="btn btn-sm btn-link text-danger p-0 text-decoration-none" onclick="clearCart()">Kosongkan</button>
            </div>
            <div id="cartItemsList" class="cart-scroll-area"></div>
          </div>

          <div class="card bg-dark-card border-0 p-3 mb-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="text-secondary">Total Tagihan:</span>
              <span class="fw-bold text-accent fs-5" id="cartGrandTotal">Rp 0</span>
            </div>

            <div class="mb-2">
              <label class="small text-secondary mb-1">Metode Bayar</label>
              <div class="btn-group w-100" role="group">
                <input type="radio" class="btn-check" name="payType" id="payTunai" value="Tunai" checked onchange="togglePayMethod()">
                <label class="btn btn-outline-custom btn-sm" for="payTunai">Tunai</label>

                <input type="radio" class="btn-check" name="payType" id="payQris" value="QRIS" onchange="togglePayMethod()">
                <label class="btn btn-outline-custom btn-sm" for="payQris">QRIS</label>

                <input type="radio" class="btn-check" name="payType" id="payKasbon" value="Kasbon" onchange="togglePayMethod()">
                <label class="btn btn-outline-custom btn-sm text-warning" for="payKasbon">Kasbon</label>
              </div>
            </div>

            <!-- Kalkulator Tunai -->
            <div id="cashCalcArea">
              <label class="small text-secondary mb-1">Uang Diterima (Rp)</label>
              <input type="number" id="inputCashPaid" class="form-control form-control-dark mb-2" placeholder="0" oninput="calcChange()">
              <div class="quick-cash-grid mb-2">
                <button class="btn-quick" onclick="setQuickCash('exact')">Uang Pas</button>
                <button class="btn-quick" onclick="setQuickCash(20000)">20.000</button>
                <button class="btn-quick" onclick="setQuickCash(50000)">50.000</button>
                <button class="btn-quick" onclick="setQuickCash(100000)">100.000</button>
              </div>
              <div class="d-flex justify-content-between align-items-center p-2 rounded bg-dark">
                <span class="small text-secondary">Kembalian:</span>
                <span class="fw-bold text-success" id="labelChangeAmount">Rp 0</span>
              </div>
            </div>

            <button class="btn btn-primary-custom w-100 py-3 mt-3 fw-bold" id="btnSubmitOrder" onclick="processOrderCheckout()">
              SELESAIKAN TRANSAKSI
            </button>
          </div>
        </div>
      </section>

      <!-- VIEW 3: RIWAYAT / LOG PENJUALAN -->
      <section id="viewHistory" class="tab-view">
        <div class="container-fluid px-3 pt-2">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="fw-bold text-white mb-0">Log Penjualan Shift Ini</h6>
            <button class="btn btn-sm btn-outline-custom" onclick="loadShiftHistory()"><i class="bi bi-arrow-clockwise"></i></button>
          </div>
          <div id="historyOrdersList"></div>
        </div>
      </section>

      <!-- VIEW 4: BUKU KASBON -->
      <section id="viewKasbon" class="tab-view">
        <div class="container-fluid px-3 pt-2">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="fw-bold text-white mb-0">Buku Kasbon Pelanggan</h6>
            <button class="btn btn-sm btn-outline-custom" onclick="loadKasbonData()"><i class="bi bi-arrow-clockwise"></i></button>
          </div>
          <div id="kasbonListContainer"></div>
        </div>
      </section>
    </main>

    <!-- FLOATING CART -->
    <div id="floatingCartBar" class="floating-cart" onclick="navToTab('cart')">
      <div class="d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
          <div class="cart-bubble"><span id="floatingCartCount">0</span></div>
          <div>
            <div class="text-white fw-bold" id="floatingCartTotal">Rp 0</div>
            <small class="text-secondary">Ketuk untuk checkout</small>
          </div>
        </div>
        <i class="bi bi-chevron-right text-white"></i>
      </div>
    </div>

    <!-- BOTTOM DOCK -->
    <nav class="bottom-dock d-flex justify-content-around align-items-center">
      <button class="dock-btn active" id="dockMenu" onclick="navToTab('menu')">
        <i class="bi bi-grid-fill"></i>
        <span>Menu</span>
      </button>
      <button class="dock-btn" id="dockCart" onclick="navToTab('cart')">
        <i class="bi bi-basket3-fill"></i>
        <span>Keranjang</span>
      </button>
      <button class="dock-btn" id="dockHistory" onclick="navToTab('history')">
        <i class="bi bi-journal-text"></i>
        <span>Log Jual</span>
      </button>
      <button class="dock-btn" id="dockKasbon" onclick="navToTab('kasbon')">
        <i class="bi bi-book-half"></i>
        <span>Kasbon</span>
      </button>
    </nav>
  </div>

  <!-- MODAL PELUNASAN KASBON -->
  <div class="modal fade" id="payKasbonModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content bg-dark-card border-0 text-white">
        <div class="modal-header border-bottom border-dark py-2">
          <h6 class="modal-title fw-bold">Pelunasan Kasbon</h6>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="modalKasbonId">
          <div class="mb-2">
            <label class="small text-secondary">Nama Pelanggan</label>
            <div class="fw-bold text-accent" id="modalKasbonName">-</div>
          </div>
          <div class="mb-2">
            <label class="small text-secondary">Sisa Hutang</label>
            <div class="fw-bold text-danger fs-5" id="modalKasbonSisa">Rp 0</div>
          </div>
          <div class="mb-2">
            <label class="small text-secondary">Nominal Pembayaran (Rp)</label>
            <input type="number" id="modalKasbonPayAmount" class="form-control form-control-dark" placeholder="0">
          </div>
          <div class="mb-2">
            <label class="small text-secondary">Metode</label>
            <select id="modalKasbonMethod" class="form-select form-select-dark">
              <option value="Tunai">Tunai</option>
              <option value="QRIS">QRIS</option>
            </select>
          </div>
        </div>
        <div class="modal-footer border-top border-dark py-2">
          <button type="button" class="btn btn-primary-custom w-100 fw-bold" onclick="submitPayKasbon()">Terima Pembayaran</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js?v=100"></script>
</body>
</html>
